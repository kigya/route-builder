name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run prebuild
      - run: ./gradlew :app:assembleStandaloneDebug :app:lintStandaloneDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: route-builder-standalone-debug
          path: android/app/build/outputs/apk/standaloneDebug/*.apk
          if-no-files-found: error
          retention-days: 14
